# ============================================================
# dpo_expr_clean.yaml — 表达式路线 DPO 消融
# ============================================================
inherit: base

data:
  train_path: "data/processed/train_expr_dpo_clean.json"

model:
  sft_checkpoint: "outputs/checkpoints/sft_expr_clean/best"

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  max_length: 512
  max_prompt_length: 256

training:
  output_dir: "outputs/checkpoints/dpo_expr_clean"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  save_steps: 100
  eval_steps: 100
  gradient_checkpointing: false

logging:
  run_name: "dpo-expr-clean"
  tags: ["dpo", "expression", "clean-data", "ablation"]
