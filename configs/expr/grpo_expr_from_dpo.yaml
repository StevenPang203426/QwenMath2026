# ============================================================
# grpo_expr_from_dpo.yaml — 表达式方案 DPO→GRPO 训练
# 六维奖励：eval正确性 / 可解析性 / 格式标签 / 无非法字符 / answer一致性 / 输出洁净
# ============================================================
inherit: base

data:
  train_path: "data/raw/train.json"

model:
  sft_checkpoint: "outputs/checkpoints/dpo_expr/best"

grpo:
  num_generations: 8
  max_new_tokens: 128                  # 表达式远短于 CoT
  temperature: 0.8
  top_p: 0.95
  max_prompt_length: 256
  max_completion_length: 128
  use_vllm: false

# 奖励函数由 src/models/reward_expr.py 的 build_expr_reward_funcs() 构建
# 6 个独立函数，TRL 自动求和 + 分维度日志
# 理论总分：-1.6 ~ +1.7

training:
  output_dir: "outputs/checkpoints/grpo_expr_from_dpo"
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  gradient_checkpointing: false
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  dataloader_num_workers: 4
  save_steps: 100
  eval_steps: 100
  max_grad_norm: 0.1

logging:
  run_name: "grpo-expr-from-dpo-4reward"
  tags: ["grpo", "expression", "dpo-init", "4-reward"]
