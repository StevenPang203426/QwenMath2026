# ============================================================
# sft_expr_clean.yaml — 表达式路线 SFT（clean 安全表达式数据）
# ============================================================
inherit: base

data:
  train_path: "data/splits/train_expr_clean_train.json"
  val_path: "data/splits/train_expr_clean_val.json"
  target_format: "expression"
  max_length: 256

training:
  output_dir: "outputs/checkpoints/sft_expr_clean"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  save_steps: 500
  eval_steps: 500
  gradient_checkpointing: false

logging:
  run_name: "sft-expr-clean"
  tags: ["sft", "expression", "clean-data"]
