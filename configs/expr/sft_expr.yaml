# ============================================================
# sft_expr.yaml — 表达式方案 SFT 训练
# 让模型学会输出可计算的中缀数学表达式
# ============================================================
inherit: base

data:
  train_path: "data/processed/train_expr.json"
  target_format: "expression"
  max_length: 256

training:
  output_dir: "outputs/checkpoints/sft_expr"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  save_steps: 500
  eval_steps: 500
  gradient_checkpointing: false       # 32GB 显存充裕

logging:
  run_name: "sft-expr"
  tags: ["sft", "expression"]
