# ============================================================
# grpo_expr_from_dpo_clean.yaml — 表达式路线 DPO→GRPO 消融
# ============================================================
inherit: base

data:
  train_path: "data/splits/train_expr_clean_train.json"
  val_path: "data/splits/train_expr_clean_val.json"

model:
  sft_checkpoint: "outputs/checkpoints/dpo_expr_clean/best"

grpo:
  num_generations: 8
  max_new_tokens: 128
  temperature: 0.8
  top_p: 0.95
  max_prompt_length: 256
  max_completion_length: 128
  use_vllm: false

training:
  output_dir: "outputs/checkpoints/grpo_expr_from_dpo_clean"
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  gradient_checkpointing: false
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  dataloader_num_workers: 4
  save_steps: 100
  eval_steps: 100
  max_grad_norm: 0.1

logging:
  run_name: "grpo-expr-from-dpo-clean-6reward"
  tags: ["grpo", "expression", "clean-data", "dpo-init", "6-reward", "ablation"]
