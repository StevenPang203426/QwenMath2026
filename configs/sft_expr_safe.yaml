# ============================================================
# sft_expr_safe.yaml — 表达式方案 SFT（安全修复数据）
# ============================================================
inherit: base

data:
  train_path: "data/processed/train_expr_safe.json"

training:
  output_dir: "outputs/checkpoints/sft_expr_safe"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  save_steps: 500
  eval_steps: 500
  gradient_checkpointing: false

logging:
  run_name: "sft-expr-safe"
  tags: ["sft", "expression", "safe-data"]
